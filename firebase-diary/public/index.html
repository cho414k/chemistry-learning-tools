<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하루의 조각 · 나만의 일기장</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><header><a href="https://cho414k.github.io/chemistry-learning-tools/" id="home">△ CHEM LAB <span>/ 허브로 돌아가기</span></a><span class="local">● 나만의 클라우드 기록</span></header>
<main><div class="intro"><div><p class="eyebrow">A LITTLE SPACE FOR YOUR DAY</p><h1>하루의 조각<span>.</span></h1><p>작은 순간도, 오래 남기고 싶은 마음도.</p></div><button id="new" class="primary" disabled>＋ 새 일기</button></div>
<section class="auth-panel" aria-label="계정"><button id="login" class="primary">Google 계정으로 로그인</button><span id="account"></span><button id="logout" class="subtle" hidden>로그아웃</button><p>로그인한 계정의 일기만 볼 수 있습니다. 공용 기기에서는 사용 후 로그아웃하세요.</p></section>
<div class="layout"><aside><div class="list-heading"><h2>나의 기록</h2><span id="count">0편</span></div><label class="search-label" for="search">불러온 기록에서 검색</label><input id="search" type="search" placeholder="제목이나 내용 검색"><label class="search-label" for="month">불러온 기록의 월별 보기</label><input id="month" type="month"><button id="reset" class="subtle">필터 초기화</button><div id="list"></div><button id="more" class="subtle" hidden>이전 기록 더 불러오기</button></aside>
<section class="paper"><form id="editor"><fieldset id="editor-fields" disabled><div class="paper-top"><span id="mode">새로운 하루</span><span id="saved">아직 저장하지 않았어요</span></div><div class="meta"><label>날짜<input id="date" type="date" min="1900-01-01" max="2100-12-31" required></label><label>오늘의 기분<select id="mood"><option>평온</option><option>좋음</option><option>보통</option><option>속상</option><option>피곤</option></select></label></div><label class="sr-only" for="title">일기 제목</label><input id="title" placeholder="오늘은 어떤 하루였나요?" maxlength="120" required><label class="sr-only" for="body">일기 내용</label><textarea id="body" placeholder="마음에 남은 순간을 자유롭게 적어보세요…" maxlength="100000" required></textarea><div class="paper-bottom"><span id="chars">0자</span><div><button type="button" id="delete" class="danger" hidden>삭제</button><button class="primary" id="save">일기 저장 ↗</button></div></div></fieldset></form></section></div>
<p id="status" role="status" aria-live="polite">Google 계정으로 로그인하면 일기를 쓸 수 있습니다.</p><footer>일기는 본인의 Firebase 계정 영역에 저장됩니다. 이 컴퓨터의 기존 로컬 일기는 자동 업로드하지 않습니다.</footer></main></body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"><title>하루의 조각 · 일기장</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><header><a href="/" id="home">△ CHEM LAB <span>/ 허브로 돌아가기</span></a><span class="local">● 로컬 저장</span></header>
<main><div class="intro"><div><p class="eyebrow">A LITTLE SPACE FOR YOUR DAY</p><h1>하루의 조각<span>.</span></h1><p>작은 순간도, 오래 남기고 싶은 마음도.</p></div><button id="new" class="primary">＋ 새 일기</button></div>
<div class="layout"><aside><div class="list-heading"><h2>나의 기록</h2><span id="count">0편</span></div><label class="search-label" for="search">기록 검색</label><input id="search" type="search" placeholder="제목이나 내용 검색"><label class="search-label" for="month">월별 보기</label><input id="month" type="month"><button id="reset" class="subtle">필터 초기화</button><div id="list"></div></aside>
<section class="paper"><form id="editor"><div class="paper-top"><span id="mode">새로운 하루</span><span id="saved">아직 저장하지 않았어요</span></div><div class="meta"><label>날짜<input id="date" type="date" required></label><label>오늘의 기분<select id="mood"><option>평온</option><option>좋음</option><option>보통</option><option>속상</option><option>피곤</option></select></label></div><label class="sr-only" for="title">일기 제목</label><input id="title" placeholder="오늘은 어떤 하루였나요?" maxlength="120" required><label class="sr-only" for="body">일기 내용</label><textarea id="body" placeholder="마음에 남은 순간을 자유롭게 적어보세요…" maxlength="100000" required></textarea><div class="paper-bottom"><span id="chars">0자</span><div><button type="button" id="delete" class="danger" hidden>삭제</button><button class="primary" id="save">일기 저장 ↗</button></div></div></form></section></div>
<p id="status" role="status" aria-live="polite">기록을 불러오는 중입니다.</p><footer>이 컴퓨터의 local-data/diary.sqlite에 저장됩니다. 저장 버튼을 눌러 기록을 남겨 주세요.</footer></main></body></html>
